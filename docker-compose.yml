version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: governance-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: governance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: governance-grafana
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana

  pipeline:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    container_name: governance-pipeline
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: governance
      DB_USER: postgres
      DB_PASSWORD: admin
      DB_SCHEMA: public
      TABLE_NAME: sre_kpis
      SAMPLE_CSV_PATH: sample_kpis.csv
      LOAD_RETAIL_DATA: "true"
      LOAD_FRESHSERVICE_DATA: "false"
      AUTO_GENERATE_DASHBOARDS: "true"
      FRESHSERVICE_API_KEY: ""
      FRESHSERVICE_DOMAIN: ""
    volumes:
      - ./pipeline:/app
      - ./pipeline/documents:/app/documents
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    command: ["python", "etl_enhanced.py"]

volumes:
  postgres_data:
  grafana_data:
