version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: governance-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: governance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana:latest
    container_name: governance-grafana
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana

  pipeline:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    container_name: governance-pipeline
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: governance
      DB_USER: postgres
      DB_PASSWORD: admin
      DB_SCHEMA: public
      TABLE_NAME: sre_kpis
      SAMPLE_CSV_PATH: sample_kpis.csv
    volumes:
      - ./pipeline:/app
    command: ["python", "etl.py"]

volumes:
  postgres_data:
  grafana_data:
